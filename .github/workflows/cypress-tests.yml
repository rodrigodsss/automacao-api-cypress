name: Cypress Tests - CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes Cypress
        run: npm run cypress:run
        continue-on-error: true

      - name: Gerar relatório (se houver falhas)
        if: always()
        run: |
          if [ -d "cypress/reports/mocha" ]; then
            ls -la cypress/reports/mocha/
          fi

      - name: Upload relatórios como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports-node-${{ matrix.node-version }}
          path: cypress/reports/mocha/
          retention-days: 30

      - name: Upload screenshots (se houver falhas)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-node-${{ matrix.node-version }}
          path: cypress/screenshots/
          retention-days: 7

      - name: Upload vídeos (se houver)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-node-${{ matrix.node-version }}
          path: cypress/videos/
          retention-days: 7

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            try {
              const reportPath = path.join('cypress/reports/mocha/mochawesome.json');
              if (fs.existsSync(reportPath)) {
                const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
                const { stats } = report;
                
                let summary = `## 📊 Resultados dos Testes (Node ${{ matrix.node-version }})\n\n`;
                summary += `| Métrica | Valor |\n`;
                summary += `|---------|-------|\n`;
                summary += `| Total | ${stats.tests} |\n`;
                summary += `| ✅ Passando | ${stats.passes} |\n`;
                summary += `| ❌ Falhando | ${stats.failures} |\n`;
                summary += `| ⏭️ Pendentes | ${stats.pending} |\n`;
                summary += `| ⏱️ Duração | ${(stats.duration / 1000).toFixed(2)}s |\n\n`;
                
                const passRate = ((stats.passes / stats.tests) * 100).toFixed(2);
                summary += `**Taxa de Sucesso:** ${passRate}%\n`;
                
                if (stats.failures === 0) {
                  summary += '\n✅ Todos os testes passaram!';
                } else {
                  summary += `\n❌ ${stats.failures} teste(s) falharam.`;
                }
                
                console.log(summary);
              }
            } catch (error) {
              console.log('Não foi possível ler o relatório:', error.message);
            }

      - name: Falhar se houver testes falhando
        if: failure()
        run: exit 1
